# Conformance metrics for the documentation site.
#
# Hand-maintained. The conformance harness should emit this file; until it
# does, re-run the tests below before changing a number.
#
# Verified 2026-11-23 against master, with
#   go test -v ./internal/conformance/
#
#   acceptance_*  TestSuiteAcceptance
#   decoder_*     TestYAMLTestSuite
#   tojson_*      TestSuiteToJSON (TestSuiteToJSONTokens gives the same counts)
#   roundtrip_*   TestSuiteRoundTrip
params:
    metrics:
        # YAML test suite, 402 cases. 9 state no expectation and are left out.
        acceptance_scoreable: 393
        acceptance_passing: 393
        acceptance_valid: 299
        acceptance_invalid: 94

        # YAML test suite through Unmarshal. The 31 cases left out: 20 state
        # the expectation as out.yaml, which the harness does not read; 9 state
        # no expectation; 1 !!omap decodes to an ordered map, not to the array
        # that spells it; 1 !!binary writes canonical base64, where the fixture
        # keeps its line breaks.
        decoder_cases: 402
        decoder_scoreable: 371
        decoder_passing: 371

        # YAML test suite through ToJSON. The 2 that diverge are the same
        # !!omap and !!binary cases.
        tojson_scoreable: 274
        tojson_passing: 272

        # Every case the parser accepts, rendered, parsed and rendered again.
        roundtrip_cases: 308
        roundtrip_passing: 308
